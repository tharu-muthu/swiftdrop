spring:
  application:
    name: swiftdrop
  # Explicit loading for mvnw spring-boot:run (pom.xml anchors its cwd to backend/).
  # Root .env supplies legacy/local Compose settings; backend/.env wins for matching keys.
  # Files use Java properties syntax: KEY=value, without shell export or surrounding quotes.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    # All developers use these same three SPRING_DATASOURCE_* keys in backend/.env.
    # POSTGRES_* remains only as a test/legacy fallback; Compose uses Neon.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:swiftdrop}${POSTGRES_PARAMS:}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:swiftdrop}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: swiftdrop
        jdbc:
          time_zone: UTC
  flyway:
    # DatabaseMigrationConfig derives a direct connection from the runtime URL.
    # Explicit placeholders load the same keys from Java-properties .env files and OS env.
    # The URL guard rejects a pooler or a different endpoint/database before migration.
    url: ${SPRING_FLYWAY_URL:}
    user: ${SPRING_FLYWAY_USER:${spring.datasource.username}}
    password: ${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}
    enabled: true
    default-schema: swiftdrop
    schemas: swiftdrop
    create-schemas: true
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:swiftdrop}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:swiftdrop}
    connection-timeout: 5s
server:
  port: ${BACKEND_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# PostgreSQL constraint details may include whole rows (including password hashes).
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.SQL: OFF

swiftdrop:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    issuer: ${AUTH_JWT_ISSUER:https://swiftdrop.local}
    audience: ${AUTH_JWT_AUDIENCE:swiftdrop-api}
    access-ttl: ${AUTH_ACCESS_TTL:10m}
    refresh-ttl: ${AUTH_REFRESH_TTL:7d}
    # Opt in only on loopback development origins. All other environments use Secure cookies.
    localhost-development: ${AUTH_LOCALHOST_DEVELOPMENT:false}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
  google:
    enabled: ${GOOGLE_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    frontend-origin: ${GOOGLE_FRONTEND_ORIGIN:http://127.0.0.1:5173}
