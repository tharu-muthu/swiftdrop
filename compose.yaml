name: swiftdrop

services:
  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftdrop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-swiftdrop}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-swiftdrop}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-swiftdrop}
      BACKEND_PORT: 8081
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in private root .env}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://swiftdrop.local}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-swiftdrop-api}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-10m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-7d}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # This Compose file exposes only loopback HTTP. Use false with HTTPS in deployment.
      AUTH_LOCALHOST_DEVELOPMENT: 'true'
      AUTH_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '3', 'http://localhost:8081/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
